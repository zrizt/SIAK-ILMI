name: siak_ilmi
description: Sistem Informasi Administrasi dan Keuangan Darul Ilmi - Mobile-first offline-first student administration and financial management system.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # File Parsers (Dapodik Import)
  excel: ^4.0.3
  csv: ^6.0.0

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.1

  # File Sharing (WhatsApp / PDF export)
  share_plus: ^10.0.0

  # Bluetooth Thermal Printing (ESC/POS)
  blue_thermal_printer: ^1.1.2
  esc_pos_utils_plus: ^2.0.2

  # Google Drive Backup
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.1

  # Archiving / Compression (local .zip backup)
  archive: ^3.6.1

  # Utilities
  intl: ^0.20.3
  crypto: ^3.0.3
  shared_preferences: ^2.2.3

  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  gap: ^3.0.1
  flutter_slidable: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
